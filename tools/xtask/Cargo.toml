[package]
name = "xtask"
description = "The workspace task runner: the gate tiers, the clippy policy, the seams and the checks clippy cannot express."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# One test binary per tier, as every crate has: a stray tests/*.rs cannot become a
# test target silently.
autotests = false

[features]
# Tier switch only: no code is gated on it, and this crate has no `dat` test binary. It exists so
# that a workspace-wide `--features retail-dats` run resolves here.
retail-dats = []

[dependencies]
# `crate-docs` reads `cargo metadata`; the release indexes are JSON.
serde_json.workspace = true
# The rules state their patterns as regular expressions.
regex = "1"
# The sweep runs test binaries without cargo, so it reads the Cargo configuration's `[env]` itself.
toml.workspace = true
# Where the gates look for the retail dats: the same lookup the tests they run use.
pyreal-dat = { workspace = true, features = ["test-support"] }
# The GPU tiers and the gates queue on the machine lock.
pyreal-machine-lock.workspace = true

# The retail comparisons read and write their pictures.
png.workspace = true

# `package`: the release archives (a .zip for Windows, a .tar.gz elsewhere, with zlib-rs's
# deflate) and their checksums.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2.workspace = true
sha2.workspace = true

[lints]
workspace = true

# The repository-wide gates: each runs a checker over the tracked tree.
[[test]]
name = "cpu"
path = "tests/cpu/main.rs"
