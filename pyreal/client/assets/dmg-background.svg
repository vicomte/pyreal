<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <!-- The disk image window's picture: parchment with a beaded rim, an ink arrow from the app
       (centred at 160, 190) to Applications (480, 190). render-dmg-background.py makes the TIFF. -->
  <defs>
    <radialGradient id="paper" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#f7eed8"/>
      <stop offset="0.7" stop-color="#ead9b0"/>
      <stop offset="1" stop-color="#d8bf88"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 0 0.12  0 0 0 0.10 0"/>
    </filter>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a6a26" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7a5019"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#paper)"/>
  <rect width="640" height="400" filter="url(#grain)"/>
  <rect x="14" y="14" width="612" height="372" rx="18" fill="none" stroke="#7d541c" stroke-opacity="0.55" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0.1 9"/>
  <rect x="22" y="22" width="596" height="356" rx="13" fill="none" stroke="#9a6a26" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M250 196 C 290 168, 340 168, 378 188" fill="none" stroke="url(#ink)" stroke-width="5" stroke-linecap="round"/>
  <path d="M362 172 L 392 194 L 358 202" fill="none" stroke="#7a5019" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="356" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="15" font-style="italic" fill="#5a3a12" fill-opacity="0.85">Drag Pyreal to Applications to install it.</text>
</svg>
