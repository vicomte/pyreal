name: CI

on:
  # Nothing runs on an ordinary push or pull request. A version tag runs these checks through the
  # release workflow, and a manual run on main also refreshes the build caches the tags read.
  # Nothing here runs on a Mac: `cargo xtask ci prepush` runs the Mac's checks before each push.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every no-data test and clippy, once, on Linux: the cheapest runner, and the one that shows what
  # fails off the Mac. The Mac runs them before each push (`cargo xtask ci prepush`), and each
  # system's package job builds and links what it ships.
  linux:
    name: tests and clippy (Linux)
    runs-on: ubuntu-latest
    # Only a hang should reach this.
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      # Incremental builds cannot be cached, and a fresh checkout has nothing to build on.
      CARGO_INCREMENTAL: '0'
      # sccache keeps a run's compiled libraries in the Actions cache as they are built, even when
      # the run is later cancelled. RUSTC_WRAPPER is set below, only once it has started.
      SCCACHE_GHA_ENABLED: 'on'
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      # If its server dies mid-run, compile without it rather than fail.
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The whole history and its tags: a release's upgrade declaration is checked against the
          # previous release's tag, and the build number is the commit count.
          fetch-depth: 0
      - name: Install the Linux build inputs
        # ALSA for the audio output (cpal) and pkg-config to find it; the README's platform table.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Install the workspace Rust version
        run: |
          # `[workspace.package] rust-version`, the one `rust-version = "..."` line in Cargo.toml.
          $found = Select-String -Path Cargo.toml -Pattern '^rust-version\s*=\s*"([^"]+)"'
          if (@($found).Count -ne 1) { Write-Error "Cargo.toml must hold exactly one rust-version line"; exit 1 }
          $toolchain = $found.Matches[0].Groups[1].Value
          rustup toolchain install $toolchain --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set $toolchain
      # The dependencies' builds and the registry, kept between runs, one cache for each job.
      # Runs on main save theirs; a tag's run restores main's and saves nothing. After the toolchain:
      # its version is part of the key.
      - name: The dependencies' builds from earlier runs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The workspace's own libraries, which the cache above leaves out. An optional extra: when the
      # action or the cache service fails, the build goes on without it and only takes longer.
      - name: Install sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
          # Its closing report can fail a job; the step below says the same and cannot.
          disable_annotations: true
      - name: Use sccache if it starts
        if: steps.sccache.outcome == 'success'
        continue-on-error: true
        run: |
          sccache --start-server
          if ($LASTEXITCODE -eq 0) {
            "RUSTC_WRAPPER=sccache" >> $env:GITHUB_ENV
          } else {
            Write-Output "::warning::sccache did not start; building without it"
          }
          exit 0
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Tests
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo xtask ci tier0 --only test
      - name: Clippy
        if: ${{ !cancelled() }}
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo xtask ci tier0 --only clippy
      - name: How sccache did
        if: ${{ !cancelled() && steps.sccache.outcome == 'success' }}
        continue-on-error: true
        run: |
          sccache --show-stats
          $s = (sccache --show-stats --stats-format=json | ConvertFrom-Json).stats
          Write-Output "::notice title=sccache::hits $($s.cache_hits.counts.Rust), misses $($s.cache_misses.counts.Rust), errors $($s.cache_errors.counts.Rust), not cacheable $($s.requests_not_cacheable)"
          exit 0

  # Clippy over every crate, which reads the code each system compiles alone, and the tests of the
  # crates with Windows code of their own that build without the graphics stack
  # (`cargo xtask ci smoke --list`). The Windows package job builds and links what it ships.
  windows:
    name: clippy and smoke tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      # Incremental builds cannot be cached, and a fresh checkout has nothing to build on.
      CARGO_INCREMENTAL: '0'
      # sccache keeps a run's compiled libraries in the Actions cache as they are built, even when
      # the run is later cancelled. RUSTC_WRAPPER is set below, only once it has started.
      SCCACHE_GHA_ENABLED: 'on'
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      # If its server dies mid-run, compile without it rather than fail.
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The whole history and its tags: a release's upgrade declaration is checked against the
          # previous release's tag, and the build number is the commit count.
          fetch-depth: 0
      - name: Install the workspace Rust version
        run: |
          # `[workspace.package] rust-version`, the one `rust-version = "..."` line in Cargo.toml.
          $found = Select-String -Path Cargo.toml -Pattern '^rust-version\s*=\s*"([^"]+)"'
          if (@($found).Count -ne 1) { Write-Error "Cargo.toml must hold exactly one rust-version line"; exit 1 }
          $toolchain = $found.Matches[0].Groups[1].Value
          rustup toolchain install $toolchain --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set $toolchain
      - name: Authenticate the DXC download
        env:
          GH_TOKEN: ${{ github.token }}
        # mach-dxcompiler's build script asks GitHub's API for its release with curl; unauthenticated,
        # a shared runner's address can run out of requests.
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'curl-home'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $line = "header = `"Authorization: Bearer $env:GH_TOKEN`""
          foreach ($name in '.curlrc', '_curlrc') { Set-Content -Path (Join-Path $dir $name) -Value $line -Encoding ascii }
          "CURL_HOME=$dir" >> $env:GITHUB_ENV
      # The dependencies' builds and the registry, kept between runs, one cache for each job.
      # Runs on main save theirs; a tag's run restores main's and saves nothing. After the toolchain:
      # its version is part of the key.
      - name: The dependencies' builds from earlier runs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The workspace's own libraries, which the cache above leaves out. An optional extra: when the
      # action or the cache service fails, the build goes on without it and only takes longer.
      - name: Install sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
          # Its closing report can fail a job; the step below says the same and cannot.
          disable_annotations: true
      - name: Use sccache if it starts
        if: steps.sccache.outcome == 'success'
        continue-on-error: true
        run: |
          sccache --start-server
          if ($LASTEXITCODE -eq 0) {
            "RUSTC_WRAPPER=sccache" >> $env:GITHUB_ENV
          } else {
            Write-Output "::warning::sccache did not start; building without it"
          }
          exit 0
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Clippy
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo xtask ci tier0 --only clippy
      - name: Smoke tests
        if: ${{ !cancelled() }}
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo xtask ci smoke
      - name: How sccache did
        if: ${{ !cancelled() && steps.sccache.outcome == 'success' }}
        continue-on-error: true
        run: |
          sccache --show-stats
          $s = (sccache --show-stats --stats-format=json | ConvertFrom-Json).stats
          Write-Output "::notice title=sccache::hits $($s.cache_hits.counts.Rust), misses $($s.cache_misses.counts.Rust), errors $($s.cache_errors.counts.Rust), not cacheable $($s.requests_not_cacheable)"
          exit 0

  # The rules and the docs read the same source everywhere, so they run once.
  rules:
    name: rules and docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_INCREMENTAL: '0'
      SCCACHE_GHA_ENABLED: 'on'
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the Linux build inputs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Install the workspace Rust version
        run: |
          $found = Select-String -Path Cargo.toml -Pattern '^rust-version\s*=\s*"([^"]+)"'
          if (@($found).Count -ne 1) { Write-Error "Cargo.toml must hold exactly one rust-version line"; exit 1 }
          $toolchain = $found.Matches[0].Groups[1].Value
          rustup toolchain install $toolchain --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set $toolchain
      - name: Install sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
          # Its closing report can fail a job; the step below says the same and cannot.
          disable_annotations: true
      - name: Use sccache if it starts
        if: steps.sccache.outcome == 'success'
        continue-on-error: true
        run: |
          sccache --start-server
          if ($LASTEXITCODE -eq 0) {
            "RUSTC_WRAPPER=sccache" >> $env:GITHUB_ENV
          } else {
            Write-Output "::warning::sccache did not start; building without it"
          }
          exit 0
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Rules
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo xtask ci tier0 --only rules
      - name: Docs
        if: ${{ !cancelled() }}
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo xtask ci tier0 --only docs
      - name: How sccache did
        if: ${{ !cancelled() && steps.sccache.outcome == 'success' }}
        continue-on-error: true
        run: |
          sccache --show-stats
          $s = (sccache --show-stats --stats-format=json | ConvertFrom-Json).stats
          Write-Output "::notice title=sccache::hits $($s.cache_hits.counts.Rust), misses $($s.cache_misses.counts.Rust), errors $($s.cache_errors.counts.Rust), not cacheable $($s.requests_not_cacheable)"
          exit 0
