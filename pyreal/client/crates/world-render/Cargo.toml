[package]
name = "pyreal-world-render"
description = "The retail client's world rules with no GPU code: the sky through the day and the preview spaces' camera."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# Test targets are declared explicitly, so a stray tests/*.rs cannot become one silently.
autotests = false

[features]
# Tier switch only: no code or test is gated on it. The gates pass it to every tiered crate.
retail-dats = []

[dependencies]
pyreal-primitives.workspace = true
# World data only: the decoded landblock / Region / Scene / GfxObjDegradeInfo structs. This crate
# consumes decoded structs; it decodes nothing itself. No renderer crate is linked.
pyreal-assets.workspace = true
# The landscape's geometry and static contents, consumed by draw emission.
pyreal-terrain.workspace = true

[dev-dependencies]
pyreal-terrain = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
