[package]
name = "pyreal-art"
description = "Surveys the models the world is built from: where each one is used, how often, what it is made of, and a picture of it; and packs an art pack's folder into one file."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[features]
# Tier switch only: no code is gated on it. It un-ignores the unit test that surveys real
# landblocks from the retail dats under $PYREAL_TEST_DAT_DIR.
retail-dats = []

[dependencies]
pyreal-primitives.workspace = true
# The retail files and their records.
pyreal-dat.workspace = true
pyreal-assets.workspace = true
# The interior cells, their statics and the buildings they belong to.
pyreal-world-data.workspace = true
# The landblock mesh the scenery is placed on.
pyreal-terrain.workspace = true
# The landblock's outdoor contents, placed as the client places them, and the models' parts and
# triangles.
pyreal-client-runtime.workspace = true
# The pictures, decoded as the client decodes them, and an art pack opened and packed as the
# client opens it (no device: the scene builds without a backend).
pyreal-scene.workspace = true
# The surface record's type bits.
pyreal-codecs.workspace = true
png.workspace = true
serde_json.workspace = true
# A setup's skeleton, written as glTF.
glam.workspace = true

[dev-dependencies]
# `pyreal_dat::testing`: where the retail-data test finds the dats.
pyreal-dat = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
