[package]
name = "pyreal-world-render"
description = "The retail client's world rules with no GPU code: the sky through the day, the light records, the particle emitters and the preview spaces' camera."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# Test targets are declared explicitly, so a stray tests/*.rs cannot become one silently.
autotests = false

[features]
# Tier switch only: no code is gated on it. It selects the `dat` test binary, whose
# modules read the retail dats under $PYREAL_TEST_DAT_DIR.
retail-dats = []

[dependencies]
pyreal-primitives.workspace = true
# World data only: the decoded landblock / Region / Scene / GfxObjDegradeInfo structs. This crate
# consumes decoded structs; it decodes nothing itself. The renderer is reached only through
# the `RenderBackend` trait in pyreal-primitives, and no renderer crate is linked.
pyreal-assets.workspace = true
# The landscape's geometry and static contents, consumed by draw emission.
pyreal-terrain.workspace = true

[dev-dependencies]
# Tests read the retail dats directly. That is the oracle: real landblocks, real region tables.
pyreal-dat = { workspace = true, features = ["test-support"] }
pyreal-terrain = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"
