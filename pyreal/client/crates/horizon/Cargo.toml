[package]
name = "pyreal-horizon"
description = "The Horizon interface: the client's interface, drawn from its own art."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[features]
# Tier switch only: no code is gated on it. It un-ignores the unit tests that read the retail dats
# under $PYREAL_TEST_DAT_DIR.
retail-dats = []

[dependencies]
pyreal-primitives.workspace = true
pyreal-client-contract.workspace = true
pyreal-client-runtime.workspace = true
pyreal-client-model.workspace = true
# The world's address, read from the host and port as the connection reads them: what the
# characters' own files are kept by.
pyreal-client-net.workspace = true
pyreal-dat.workspace = true
# The string tables the option labels and the game's messages are read from.
pyreal-assets.workspace = true
pyreal-input.workspace = true
# The widget kit the interface is drawn with: its draw lists, art, text, widgets and the pad's focus.
pyreal-ui-kit.workspace = true
# The plugins' windows, HUDs and marks, seated among the interface's own, and their declared trees.
pyreal-plugin-ui.workspace = true
pyreal-plugin-api.workspace = true
# Character creation's model, and the rules its skill classes come from.
pyreal-chargen.workspace = true
pyreal-rules.workspace = true
# The game's presentation rules shared by every interface: the creation model's camera.
pyreal-presentation.workspace = true
# The creation model's animation, read for its length.
pyreal-animation.workspace = true
# The game's item, spell and effect icons, decoded as the scene decodes them.
pyreal-scene.workspace = true
# The map reads a world's places as the place store its server publishes.
pyreal-navigation.workspace = true
# The game's text: its string tables' variables and its chat text tags.
pyreal-text.workspace = true
# The game's words, tables and rules the interface reads.
pyreal-ui-logic.workspace = true
tracing.workspace = true
# The interface's own pieces: their manifest and their atlases.
png.workspace = true
serde_json.workspace = true

[dev-dependencies]
pyreal-client-runtime = { workspace = true, features = ["test-support"] }
pyreal-client-model = { workspace = true, features = ["test-support"] }
pyreal-dat = { workspace = true, features = ["test-support"] }
# The animation records a real install holds, for the idle a model stands in.
pyreal-world-data.workspace = true
# The server's messages, built for the tests.
pyreal-protocol.workspace = true

[lints]
workspace = true

# The interface's behaviour, driven frame by frame with no art, no device and no server.
[[test]]
name = "cpu"
path = "tests/cpu/main.rs"
