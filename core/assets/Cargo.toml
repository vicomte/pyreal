[package]
name = "pyreal-assets"
description = "One pure decoder per data-file object type: geometry, setups, animations, palettes, textures and tables."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# A stray tests/*.rs can no longer become a test target silently.
autotests = false

[features]
# Tier switch only: no code is gated on it. It selects the `dat` test binary, whose
# modules read the retail dats under $PYREAL_TEST_DAT_DIR.
retail-dats = []

[dependencies]
pyreal-dat.workspace = true
pyreal-primitives.workspace = true
thiserror.workspace = true
# An art pack's manifest (`art_pack`) is TOML.
toml.workspace = true
# The pre-Throne-of-Destiny creation tables (`pretod::creation`) serialise.
serde.workspace = true

[dev-dependencies]
pyreal-dat = { workspace = true, features = ["test-support"] }
# The pre-Throne-of-Destiny tests compare with JSON exports.
serde_json.workspace = true

[lints]
workspace = true

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"

[[test]]
name = "dat"
path = "tests/dat/main.rs"
required-features = ["retail-dats"]

# Damaged records of every era through every decoder; ignored, run by hand.
[[test]]
name = "fuzz"
path = "tests/fuzz/main.rs"
required-features = ["retail-dats"]
